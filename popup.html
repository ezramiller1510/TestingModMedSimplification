<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      padding: 12px;
      margin: 0;
      color: #222;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 6px;
    }
    .protocol-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .custom-input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
    }
    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background-color: #445566;
    }
    button.tertiary {
      background-color: #6b7280;
    }
    button:hover {
      filter: brightness(0.92);
    }
    button:disabled {
      background-color: #99c2eb;
      cursor: not-allowed;
      filter: none;
    }
    button.secondary:disabled,
    button.tertiary:disabled {
      background-color: #9aa4ae;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #444;
      word-break: break-word;
      white-space: pre-wrap;
      max-height: 260px;
      overflow: auto;
    }
    .hint {
      margin: 0 0 10px;
      font-size: 11px;
      color: #666;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <h3>ModMed Protocols</h3>
  <p class="hint">
    Protocol apply often expands into special tests/orders — the protocol ID may not stay on the visit.
    Use Test to probe endpoints + search captured network calls.
  </p>

  <div class="protocol-list">
    <label>
      <input type="checkbox" name="protocol" value="101074" data-name="Glaucoma Tests">
      Test Protocol (101074)
    </label>
    <!-- Duplicate the <label> block above to add more saved protocols -->
  </div>

  <input
    type="text"
    id="customId"
    class="custom-input"
    placeholder="Or enter ID(s): e.g. 101075, 101076"
  >

  <div class="btn-row">
    <button id="testBtn" class="secondary" type="button">Test if applied / find endpoint</button>
    <button id="captureBtn" class="tertiary" type="button">Show captured API calls</button>
    <button id="applyBtn" type="button">Apply Protocols</button>
  </div>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
