<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 340px;
      padding: 12px;
      margin: 0;
      color: #222;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 6px;
    }
    .hint {
      margin: 0 0 10px;
      font-size: 11px;
      color: #666;
      line-height: 1.35;
    }
    .target-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
      max-height: 160px;
      overflow: auto;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      padding: 8px;
      background: #fafafa;
    }
    .target {
      font-size: 12px;
      line-height: 1.3;
    }
    .target strong {
      font-size: 12px;
    }
    .ok { color: #047857; }
    .missing { color: #b45309; }
    .custom-input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
    }
    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background-color: #445566; }
    button.tertiary { background-color: #6b7280; }
    button:hover { filter: brightness(0.92); }
    button:disabled {
      background-color: #99c2eb;
      cursor: not-allowed;
      filter: none;
    }
    button.secondary:disabled,
    button.tertiary:disabled { background-color: #9aa4ae; }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #444;
      word-break: break-word;
      white-space: pre-wrap;
      max-height: 220px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <h3>ModMed Protocol IDs</h3>
  <p class="hint">
    Collect <b>protocolId</b> (for Apply) + <b>diagnosis/procedure catalog IDs</b> (for Detect)
    from Visit Overview + captured Protocols traffic.
  </p>

  <div id="targetList" class="target-list"></div>

  <input
    type="text"
    id="manualProtocolId"
    class="custom-input"
    placeholder="Optional: set protocolId for selected target (id)"
  >
  <select id="manualTarget" class="custom-input"></select>

  <div class="btn-row">
    <button id="collectBtn" class="secondary" type="button">Collect IDs from this visit</button>
    <button id="checkBtn" class="secondary" type="button">Check if targets applied</button>
    <button id="copyBtn" class="tertiary" type="button">Copy mappings JSON</button>
    <button id="applyMappedBtn" type="button">Apply collected protocolIds</button>
  </div>
  <div id="status"></div>

  <script src="targets.js"></script>
  <script src="popup.js"></script>
</body>
</html>
