<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 360px;
      padding: 12px;
      margin: 0;
      color: #222;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 6px;
    }
    .hint {
      margin: 0 0 10px;
      font-size: 11px;
      color: #666;
      line-height: 1.35;
    }
    .add-box {
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      padding: 8px;
      margin-bottom: 10px;
      background: #fafafa;
    }
    .add-box .row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    .custom-input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
    }
    .target-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
      max-height: 180px;
      overflow: auto;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      padding: 8px;
      background: #fff;
    }
    .target {
      font-size: 12px;
      line-height: 1.35;
      border-bottom: 1px solid #f0f0f0;
      padding-bottom: 6px;
    }
    .target:last-child { border-bottom: none; padding-bottom: 0; }
    .target-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
    }
    .ok { color: #047857; }
    .missing { color: #b45309; }
    .muted { color: #888; }
    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background-color: #445566; }
    button.tertiary { background-color: #6b7280; }
    button.danger {
      width: auto;
      padding: 2px 8px;
      background: #9b1c1c;
      font-size: 11px;
      font-weight: 600;
    }
    button:hover { filter: brightness(0.92); }
    button:disabled {
      background-color: #99c2eb;
      cursor: not-allowed;
      filter: none;
    }
    button.secondary:disabled,
    button.tertiary:disabled { background-color: #9aa4ae; }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #444;
      word-break: break-word;
      white-space: pre-wrap;
      max-height: 200px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <h3>ModMed Protocols</h3>
  <p class="hint">
    Add the protocols you want to track. Detect uses <b>procedure catalog ID</b>;
    Apply uses <b>protocolId</b>.
  </p>

  <div class="add-box">
    <div class="row">
      <input id="newName" class="custom-input" placeholder="Name (e.g. Optic Nerve)" />
    </div>
    <div class="row">
      <input id="newProtocolId" class="custom-input" placeholder="Protocol ID (apply)" />
    </div>
    <div class="row">
      <input id="newAliases" class="custom-input" placeholder="Optional aliases (comma-separated)" />
    </div>
    <div class="row">
      <input id="newProcedureId" class="custom-input" placeholder="Optional procedure catalog ID (detect)" />
    </div>
    <button id="addBtn" class="secondary" type="button">Add to tracked tests</button>
  </div>

  <div id="targetList" class="target-list">
    <div class="muted">No tracked tests yet.</div>
  </div>

  <div class="btn-row">
    <button id="collectBtn" class="secondary" type="button">Collect procedure IDs from visit</button>
    <button id="checkBtn" class="secondary" type="button">Check if tracked tests applied</button>
    <button id="copyBtn" class="tertiary" type="button">Copy tracked JSON</button>
    <button id="applyMappedBtn" type="button">Apply tracked protocolIds</button>
  </div>
  <div id="status"></div>

  <script src="targets.js"></script>
  <script src="popup.js"></script>
</body>
</html>
